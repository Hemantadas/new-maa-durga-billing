name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "12_MAA_DURGA_BILLING.zip"
      - "otp-src/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o "12_MAA_DURGA_BILLING.zip" -d extracted
      - name: Add Firebase phone OTP login
        run: |
          python3 otp-src/otp_patch.py
          mkdir -p extracted/NewMaDurgaAndroid/app/src/main/java/com/newmadurga/billing
          cp otp-src/OtpLoginActivity.java extracted/NewMaDurgaAndroid/app/src/main/java/com/newmadurga/billing/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK and print SHA-1
        working-directory: extracted/NewMaDurgaAndroid
        run: |
          gradle assembleDebug signingReport --stacktrace --console=plain 2>&1 | tee build.log
          echo "----- DEBUG KEY SHA-1 (add this to Firebase Android app settings) -----"
          grep -m1 "SHA1:" build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: New-Maa-Durga-OTP-debug-APK
          path: extracted/NewMaDurgaAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
