name: New Maa Durga 6-Digit PIN DEV APK

on:
  workflow_dispatch:
  push:
    paths:
      - "46_NEW_MAA_DURGA_6DIGIT_PIN_DEV_SOURCE.zip"
      - "47_BACKUP_RESTORE.patch"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract version 46 development source ZIP
        run: |
          mkdir -p extracted
          unzip -o "46_NEW_MAA_DURGA_6DIGIT_PIN_DEV_SOURCE.zip" -d extracted
      - name: Apply version 47 backup and restore changes
        run: |
          patch -d extracted/maa12 -p1 < 47_BACKUP_RESTORE.patch
      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found in source ZIP"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build development debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: New-Maa-Durga-47-BACKUP-RESTORE-DEV-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Preserve version 47 source materials
        uses: actions/upload-artifact@v4
        with:
          name: New-Maa-Durga-47-BACKUP-RESTORE-SOURCE
          path: |
            46_NEW_MAA_DURGA_6DIGIT_PIN_DEV_SOURCE.zip
            47_BACKUP_RESTORE.patch
          if-no-files-found: error
