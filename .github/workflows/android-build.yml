name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "12_MAA_DURGA_BILLING.zip"
      - "otp-src/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o "12_MAA_DURGA_BILLING.zip" -d extracted
      - name: Diagnose Firebase and Gradle configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("extracted")
          print("=== PROJECT FILES ===")
          for p in sorted(root.rglob("*")):
              if p.is_file() and (p.name in ("settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts", "gradle.properties", "google-services.json")):
                  print(p)
          print("=== GRADLE CONFIG ===")
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name in ("settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"):
                  print("\\n---", p, "---")
                  print(p.read_text(errors="replace")[:12000])
          print("=== FIREBASE JSON SAFE FIELDS ===")
          found = False
          for p in root.rglob("google-services.json"):
              found = True
              try:
                  d = json.loads(p.read_text())
                  print("FILE:", p)
                  print("project_id:", d.get("project_info", {}).get("project_id"))
                  print("project_number:", d.get("project_info", {}).get("project_number"))
                  for c in d.get("client", []):
                      ci = c.get("client_info", {})
                      print("package_name:", ci.get("android_client_info", {}).get("package_name"))
                      print("mobilesdk_app_id:", ci.get("mobilesdk_app_id"))
              except Exception as e:
                  print("JSON_PARSE_ERROR:", type(e).__name__, str(e))
          if not found:
              print("NO google-services.json FOUND")
          PY
      - name: Add Firebase phone OTP login
        run: |
          python3 otp-src/otp_patch.py
          mkdir -p extracted/NewMaDurgaAndroid/app/src/main/java/com/newmadurga/billing
          cp otp-src/OtpLoginActivity.java extracted/NewMaDurgaAndroid/app/src/main/java/com/newmadurga/billing/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK and print SHA-1
        working-directory: extracted/NewMaDurgaAndroid
        run: |
          gradle assembleDebug signingReport --stacktrace --console=plain 2>&1 | tee build.log
          echo "----- DEBUG KEY SHA-1 (add this to Firebase Android app settings) -----"
          grep -m1 "SHA1:" build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: New-Maa-Durga-OTP-debug-APK
          path: extracted/NewMaDurgaAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
